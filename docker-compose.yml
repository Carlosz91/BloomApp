# ==========================
# BLOOMAPP - docker-compose.yml
# ==========================
# Backend  (Express + PostgreSQL) -> http://localhost:3000
# Frontend (Expo Metro)       -> http://localhost:8081
#
# Uso:
#   docker-compose up -d
#   docker logs -f bloomapp-frontend   <- QR para Expo Go
#   docker-compose down                <- detener todo
#
# La base de datos PostgreSQL persiste en el volumen nombrado `bloomapp-pg`.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bloomapp-backend
    restart: unless-stopped
    environment:
      - PORT=3000
      - NODE_ENV=production
      - JWT_SECRET=bloomapp-super-secret-key-change-in-production-32chars
      - BCRYPT_SALT_ROUNDS=10
      - DATABASE_URL=postgres://bloomapp:bloomapp@postgres:5432/bloomapp
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:18-alpine
    container_name: bloomapp-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=bloomapp
      - POSTGRES_PASSWORD=bloomapp
      - POSTGRES_DB=bloomapp
    volumes:
      # PG 18+ monta la raíz de datos (la imagen usa subdirs por versión)
      - bloomapp-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bloomapp", "-d", "bloomapp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: bloomapp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
    environment:
      # IP LAN del host (DHCP puede cambiarla: editar .env, no este archivo)
      - EXPO_PUBLIC_API_URL=http://${LAN_IP:-192.168.0.8}:3000
      # Hace que Expo anuncie exp://<LAN_IP>:8081 (IP del PC) en vez de la IP
      # interna del contenedor, para que Expo Go conecte al Metro real.
      - REACT_NATIVE_PACKAGER_HOSTNAME=${LAN_IP:-192.168.0.8}
    volumes:
      # Código del proyecto en vivo; las rutas (src/app) deben quedar en la
      # raíz del contenedor para que CLI las detecte. El volumen nombrado
      # protege node_modules del overlay del bind, y se puebla desde la
      # imagen la primera vez. Tras cambiar dependencias: docker volume rm.
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: ["npx", "expo", "start", "-c"]

volumes:
  bloomapp-pg:
  frontend_node_modules:
